{# expects `key` = a Person.person_type value; line icons in the style of _entity_icon.html #}
<svg class="ei-group-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if key == "camorrista_bandit" %}{# fedora #}
  <path d="M3 16c2 1.5 5.5 2 9 2s7-.5 9-2"/>
  <path d="M6 15.5l1.5-7c.3-1.3 1.5-2 2.6-1.5l1.9.8 1.9-.8c1.1-.5 2.3.2 2.6 1.5l1.5 7"/>
  <path d="M6.6 13h10.8"/>
{% elif key == "police_official" %}{# shield #}
  <path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/>
  <circle cx="12" cy="11" r="2.2"/>
{% elif key == "informant_contact" %}{# speech bubble #}
  <path d="M4 5h16v10H9l-5 4V5z"/>
  <circle cx="8.5" cy="10" r="1" fill="currentColor" stroke="none"/>
  <circle cx="12" cy="10" r="1" fill="currentColor" stroke="none"/>
  <circle cx="15.5" cy="10" r="1" fill="currentColor" stroke="none"/>
{% elif key == "companion" %}{# two people #}
  <circle cx="9" cy="8" r="3"/>
  <path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/>
  <circle cx="16.5" cy="8.5" r="2.5"/>
  <path d="M17 14c2.4.3 4 2.6 4 5.5"/>
{% elif key == "aristocrat" %}{# crown #}
  <path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 9H5L3 8z"/>
  <path d="M5 20.5h14"/>
{% elif key == "allied_colleague" %}{# star #}
  <path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6l-5.4 2.9 1.2-6-4.5-4.2 6.1-.7L12 3z"/>
{% elif key == "civilian_friend" %}{# heart #}
  <path d="M12 20s-7.5-4.4-7.5-10A4.2 4.2 0 0 1 12 7.3 4.2 4.2 0 0 1 19.5 10c0 5.6-7.5 10-7.5 10z"/>
{% elif key == "notable_civilian" %}{# medal #}
  <path d="M8 3l3 7.5M16 3l-3 7.5"/>
  <circle cx="12" cy="15.5" r="5"/>
{% endif %}
</svg>
