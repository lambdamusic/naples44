{# expects `icon` = entry | place | person | folklore | theme #}
<span class="entity-icon icon-{{ icon }}" aria-hidden="true">
{% if icon == "entry" %}
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 6c-1.6-1.2-3.8-2-6.2-2-.8 0-1.5.1-2 .2v13c.5-.1 1.2-.2 2-.2 2.4 0 4.6.8 6.2 2"/>
    <path d="M12 6c1.6-1.2 3.8-2 6.2-2 .8 0 1.5.1 2 .2v13c-.5-.1-1.2-.2-2-.2-2.4 0-4.6.8-6.2 2"/>
    <path d="M12 6v13"/>
  </svg>
{% elif icon == "place" %}
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 21c4-4.2 7-7.9 7-11a7 7 0 1 0-14 0c0 3.1 3 6.8 7 11z"/>
    <circle cx="12" cy="10" r="2.6"/>
  </svg>
{% elif icon == "person" %}
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="3.6"/>
    <path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/>
  </svg>
{% elif icon == "folklore" %}
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12z"/>
    <circle cx="12" cy="12" r="3.4"/>
    <circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/>
  </svg>
{% elif icon == "theme" %}
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 13.2V5.6A1.6 1.6 0 0 1 5.6 4h7.6l6.8 6.8a1.6 1.6 0 0 1 0 2.3l-6.5 6.5a1.6 1.6 0 0 1-2.3 0L4 13.2z"/>
    <circle cx="8.7" cy="8.7" r="1.4" fill="currentColor" stroke="none"/>
  </svg>
{% endif %}
</span>
